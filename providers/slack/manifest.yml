# The Slack app the bridge runs as: "Create an app" -> "From a manifest".
display_information:
  name: Qupa Cafe
  description: Mirrors the Qupa Cafe forum, one channel per category and one thread per topic.
features:
  # The Messages tab is the bot's DM. Read-only, nobody can write to the bot.
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: qupa-cafe
    always_online: true
oauth_config:
  # Sign in with Slack on the forum: README.md, "Sign in with Slack".
  redirect_urls:
    - https://forum.qupa-cafe.com/auth/oidc/callback
  scopes:
    user:
      - openid
      - email
      - profile
    bot:
      - channels:history
      - channels:join
      - channels:manage
      - channels:read
      - chat:write
      - chat:write.customize
      - files:read
      - files:write
      # A read-restricted category's private channel.
      - groups:history
      - groups:read
      - groups:write
      - im:history
      - im:write
      - mpim:history
      - mpim:read
      - mpim:write
      - users:read
      - users:read.email
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - message.im
      - message.mpim
      # Somebody joining a qupa- channel, sent their invitation.
      - member_joined_channel
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
