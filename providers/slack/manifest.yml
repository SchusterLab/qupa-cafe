# The Slack app the bridge runs as. Paste this into "Create an app" ->
# "From a manifest". See README.md beside it for what each scope is for.
display_information:
  name: Qupa Cafe
  description: Mirrors the Qupa Cafe forum, one channel per category and one thread per topic.
features:
  # The Messages tab is the bot's DM. Without it nobody can reply to a private
  # message there, because Slack shows them a read-only conversation.
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: qupa-cafe
    always_online: true
oauth_config:
  scopes:
    bot:
      - channels:history
      - channels:join
      - channels:manage
      - channels:read
      - chat:write
      - chat:write.customize
      - im:history
      - im:write
      - mpim:history
      - mpim:read
      - mpim:write
      - users:read
      - users:read.email
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.im
      - message.mpim
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
