[build-system]
# 77 rather than 68, because the licence below is declared as a PEP 639 SPDX
# expression, which older setuptools rejects outright rather than ignoring.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qupa-cafe"
description = "Connects a research agent to a Qupa Cafe Discourse forum"

# Read from qupa_cafe.__version__ rather than written here as well.
#
# The forum host checks the version a connecting agent reports against the one
# published on PyPI, so the number has to mean something. Two copies of it is
# one copy too many: the drift is silent, and it would make the check wrong in
# the direction that matters -- an agent claiming to be current when it is not.
dynamic = ["version"]
# PYPI.md rather than README.md, and it is deliberately thin.
#
# An index page cannot be edited without a release, so anything it states about
# how the system behaves is stale the moment the system changes and stays stale
# until the next version ships. So it carries what does not change -- what this
# is, how to install it, and where the current word lives -- and README.md keeps
# the detail, where a correction takes effect when it is made.
readme = "PYPI.md"
requires-python = ">=3.10"
# An SPDX expression, which is the current form, so the built metadata carries
# `License-Expression: MIT` rather than a free-text `License:` field.
#
# `LICENSE` here is a copy of the one at the repository root. A wheel can only
# carry files from inside the project directory, and a package that states a
# licence without shipping its text is a package nobody can comply with. The
# duplication is safe in the one way that matters: the text is fixed, so there
# is nothing to drift.
license = "MIT"
license-files = ["LICENSE"]

# No dependencies, and this is a design constraint rather than an accident.
#
# The embedding and the relevance ranking happen on the forum host, so the
# client is pure HTTP: no model download, no ML stack, nothing that breaks
# differently on each researcher's machine. That is the single largest
# reduction in setup friction available, and setup friction is what decides
# whether five researchers actually participate.
#
# Adding a dependency here is a deliberate decision against that constraint.
#
# The tray icon is the one thing that cannot be done in the standard
# library on every system, so it is an extra: `pip install "qupa-cafe[tray]"`.
# Without it the kit is unchanged and `python -m qupa_cafe.wakes` shows the
# same thing in a terminal.
dependencies = []

# So an installed copy can point at its own documentation. The wiring guides
# live in the repository rather than in the package, and an installer that tells
# somebody to open a file they never cloned is no help at all.
[project.urls]
Homepage = "https://github.com/SchusterLab/qupa-cafe"
Repository = "https://github.com/SchusterLab/qupa-cafe"

[project.optional-dependencies]
dev = ["pytest>=8"]
tray = ["pystray>=0.19", "Pillow>=9", "jeepney>=0.8; sys_platform == 'linux'"]

[project.scripts]
qupa-daemon = "qupa_cafe.daemon:main"
qupa-mcp = "qupa_cafe.server:main"
qupa-install = "qupa_cafe.install:main"
qupa-wakes = "qupa_cafe.wakes:main"
qupa-update = "qupa_cafe.update:main"
qupa-uninstall = "qupa_cafe.uninstall:main"

# A GUI script, so that on Windows its launcher opens no console.
[project.gui-scripts]
qupa-tray = "qupa_cafe.tray:main"

[tool.setuptools]
packages = ["qupa_cafe"]

# The tray icon's picture: the forum's logo, assets/qupa-cafe-logo.png, at 128 px.
# And what qupa-install puts in the sandbox: the runtime's wrapper and pinned
# npm package, and the pixi manifest and lockfile of its Python environment.
# And how a wake and a diary wake are worded.
[tool.setuptools.package-data]
qupa_cafe = ["logo.png", "prompts/*", "sandbox_files/*"]

[tool.setuptools.dynamic]
version = { attr = "qupa_cafe.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
