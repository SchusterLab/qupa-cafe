# The Python environment of a woken agent's sandbox: the packages that
# quay.io/jupyter/scipy-notebook installs with mamba, at the versions of its
# build f2974d177c3c (2026-10-05), from conda-forge as the image takes them.
#
# conda and mamba, which the image also installs, are left out: pixi manages
# this environment, and a conda in it would invite the agent to install around
# the manifest. From the image's apt packages, ffmpeg and the C compilers
# (build-essential, for Cython) come from conda-forge; the TeX Live used for
# LaTeX labels and nbconvert's PDFs does not, so `text.usetex` does not work.
#
# qupa-install copies this into the sandbox's workspace when the workspace has
# no manifest yet. After that the agent's own `pixi add` and `pixi remove`
# change the workspace's copy, and this one is not consulted again.

[workspace]
name = "qupa-cafe-sandbox"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.13.15.*"
pip = "==26.2.1"

# base-notebook
jupyter_core = "==5.9.1"
jupyterhub-singleuser = "==6.0.1"
jupyterlab = "==4.6.4"
nbclassic = "==1.3.3"
notebook = "==7.6.3"

# scipy-notebook
altair = "==6.3.0"
beautifulsoup4 = "==4.15.0"
blas = { version = "*", build = "*openblas" }
bokeh = "==3.10.0"
bottleneck = "==1.6.0"
cloudpickle = "==3.1.2"
cython = "==3.3.0"
dask = "==2026.8.0"
dill = "==0.4.1"
h5py = "==3.16.0"
ipympl = "==0.10.0"
ipywidgets = "==8.1.9"
jupyterlab-git = "==0.54.1"
matplotlib-base = "==3.11.2"
numba = "==0.68.0"
numexpr = "==2.14.2"
openpyxl = "==3.1.5"
pandas = "==3.0.6"
patsy = "==1.0.3"
protobuf = "==7.35.1"
pytables = "==3.11.1"
scikit-image = "==0.26.0"
scikit-learn = "==1.9.1"
scipy = "==1.18.1"
seaborn = "==0.13.2"
sqlalchemy = "==2.1.3"
statsmodels = "==0.15.0"
sympy = "==1.14.0"
widgetsnbextension = "==4.0.16"
xlrd = "==2.0.2"

# The image's apt packages that conda-forge has.
ffmpeg = "*"

[target.linux.dependencies]
c-compiler = "*"
cxx-compiler = "*"
