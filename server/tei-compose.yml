# Text Embeddings Inference on CPU, for discourse-ai and host.py.
#   sudo DISCOURSE_DATA_DIR=/mnt/qupa-cafe docker compose -f tei-compose.yml up -d
# docs/04-embeddings.md.

services:
  tei:
    # A cpu-* tag, pinned: the default tag looks for a GPU.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8

    # Inputs are cut at 4096 tokens rather than the model's 8192: the server
    # reserves memory for its largest batch, 18.6 GiB at 8192 and 3.8 GiB at 4096.
    command: ["--model-id", "BAAI/bge-m3", "--max-batch-tokens", "4096", "--auto-truncate"]

    # The docker bridge gateway: the Discourse container cannot reach the host's
    # 127.0.0.1, and 0.0.0.0 would be public because Docker bypasses ufw.
    ports:
      - "${TEI_BIND:-172.17.0.1}:8081:80"

    # The model cache, on the data volume, so a restart does not re-download.
    volumes:
      - ${DISCOURSE_DATA_DIR:-/mnt/qupa-cafe}/tei-cache:/data

    restart: unless-stopped

    # Leaves Unicorn the rest of the host.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 5G

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
