# Publish the agent kit, using a trusted publisher rather than an API token.
#
# There is no secret in this repository and none is needed. The workflow
# exchanges a short-lived OIDC token from GitHub for an upload token from the
# index, which means nothing long-lived exists to leak, rotate, or forget.
#
# This publishes to PyPI and its test instance, and nothing else. If the
# project ever needs a different index or a different artefact, that belongs
# in a separate workflow rather than as a branch inside this one.
#
# The PyPI side has to be registered once by hand; agent-kit/RELEASING.md has
# the exact values, and this file's name is one of them, so renaming it breaks
# publishing until the publisher is updated to match.
name: publish to PyPI

on:
  # The normal path: publishing follows a GitHub release, so the tag, the
  # release notes and the upload are one act rather than three.
  release:
    types: [published]

  # For a rehearsal on TestPyPI, or a re-run after a transient failure.
  workflow_dispatch:
    inputs:
      index:
        description: Which index to publish to
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  # Nothing gets published that would not pass `make check` on a laptop.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The agent kit has no dependencies by design. psycopg is here for the
      # ranking server's tests, which run on the forum host, not on a
      # researcher's machine.
      - name: Install what the tests need
        run: python -m pip install --quiet pytest "psycopg[binary]"

      - name: Documentation rules
        run: python scripts/check-docs.py

      - name: Agent kit tests
        working-directory: agent-kit
        run: python -m pytest tests -q

      - name: Ranking server tests
        run: python -m pytest server/tests -q

      - name: Syntax
        run: |
          for script in scripts/*.sh platforms/*/scripts/*.sh; do
            bash -n "$script"
          done
          for module in scripts/*.py server/*.py agent-kit/*.py agent-kit/qupa_cafe/*.py; do
            python -m py_compile "$module"
          done

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        working-directory: agent-kit
        run: |
          python -m pip install --quiet build twine
          python -m build
          python -m twine check dist/*

      # Two guards, because an upload cannot be undone. A version can be
      # yanked, never replaced, and the name plus version is burned either way.
      - name: Refuse to publish without a licence
        run: |
          python - <<'PY'
          import glob, sys, zipfile, re
          wheel = glob.glob("agent-kit/dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as z:
              name = next(n for n in z.namelist() if n.endswith("METADATA"))
              meta = z.read(name).decode()
          declared = next(
              (l.split(":", 1)[1].strip() for l in meta.splitlines() if l.startswith("License:")),
              "",
          )
          if not declared or declared.upper() in {"TBD", "UNKNOWN", "NONE"}:
              sys.exit(
                  f"License is {declared!r}. Publishing code with no licence grant means\n"
                  "nobody may legally use it, which defeats the point of publishing.\n"
                  "Set it in agent-kit/pyproject.toml and add a LICENSE file first."
              )
          print(f"licence declared as {declared}")
          PY

      - name: Refuse to publish a version that does not match the tag
        if: github.event_name == 'release'
        run: |
          python - <<'PY'
          import glob, os, re, sys
          sdist = glob.glob("agent-kit/dist/*.tar.gz")[0]
          built = re.search(r"-(\d[^-]*)\.tar\.gz$", os.path.basename(sdist)).group(1)
          tag = os.environ["TAG"].lstrip("v")
          if built != tag:
              sys.exit(f"tag {tag!r} does not match the built version {built!r}")
          print(f"tag and version agree on {built}")
          PY
        env:
          TAG: ${{ github.event.release.tag_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: agent-kit/dist/

  # A rehearsal target. Publishing to TestPyPI first is how you find out that
  # the metadata renders badly without burning a version number on the real
  # index.
  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.index == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write # the whole point: this is what replaces the API token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI accumulates rehearsals, and a repeated version there is a
          # nuisance rather than a failure worth stopping for.
          skip-existing: true

  publish-pypi:
    needs: build
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.index == 'pypi')
    runs-on: ubuntu-latest

    # Bound to an environment so the repository can require a human approval
    # before the irreversible step. Configure that on the environment itself;
    # this file cannot enforce it.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
