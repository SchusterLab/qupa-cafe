# Publish the agent kit, using a trusted publisher rather than an API token.
#
# There is no secret in this repository and none is needed. The workflow
# exchanges a short-lived OIDC token from GitHub for an upload token from the
# index, which means nothing long-lived exists to leak, rotate, or forget.
#
# This publishes this package to PyPI and does nothing else. If the project
# ever needs a different index or a different artefact, that belongs in a
# separate workflow rather than as a branch inside this one -- which is why
# the TestPyPI job that used to live here was removed rather than disabled.
#
# The PyPI side has to be registered once by hand; agent-kit/RELEASING.md has
# the exact values, and this file's name is one of them, so renaming it breaks
# publishing until the publisher is updated to match.
name: publish to PyPI

on:
  # The normal path: publishing follows a GitHub release, so the tag, the
  # release notes and the upload are one act rather than three.
  release:
    types: [published]

  # For re-running a publish that failed after the release was already made.
  #
  # There is no target to choose any more, so there is no input. Note that the
  # `pypi` environment admits only `v*` tags, so a dispatch has to select one
  # as its ref; dispatching from a branch is refused by the environment.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Nothing gets published that would not pass `make check` on a laptop.
  #
  # Across more than one interpreter, because `requires-python = ">=3.10"` is a
  # promise and a single version cannot check it. 3.10 is the floor that promise
  # names; 3.13 is a recent one. Testing only what the maintainer happens to run
  # locally is how `\z` -- valid in 3.14, an import-time error in 3.10 to 3.13 --
  # reached the default branch.
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The agent kit has no dependencies by design. psycopg is here for the
      # ranking server's tests, which run on the forum host, not on a
      # researcher's machine.
      - name: Install what the tests need
        run: python -m pip install --quiet pytest "psycopg[binary]"

      - name: Documentation rules
        run: python scripts/check-docs.py

      - name: Agent kit tests
        working-directory: agent-kit
        run: python -m pytest tests -q

      - name: Ranking server tests
        run: python -m pytest server/tests -q

      - name: Syntax
        run: |
          for script in scripts/*.sh platforms/*/scripts/*.sh; do
            bash -n "$script"
          done
          for module in scripts/*.py server/*.py agent-kit/*.py agent-kit/qupa_cafe/*.py; do
            python -m py_compile "$module"
          done

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        working-directory: agent-kit
        run: |
          python -m pip install --quiet build twine
          python -m build
          python -m twine check dist/*

      # Two guards, because an upload cannot be undone. A version can be
      # yanked, never replaced, and the name plus version is burned either way.
      - name: Refuse to publish without a licence
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheel = glob.glob("agent-kit/dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as z:
              name = next(n for n in z.namelist() if n.endswith("METADATA"))
              meta = z.read(name).decode()
              shipped = [n for n in z.namelist() if "/licenses/" in n or n.endswith("LICENSE")]

          # Two spellings, because they come from two eras of packaging. A PEP
          # 639 declaration produces `License-Expression` and NO `License`
          # field, so reading only the latter would reject a correctly licensed
          # build -- a guard failing in the direction that blocks good work.
          def field(name: str) -> str:
              prefix = name + ":"
              return next(
                  (l.split(":", 1)[1].strip() for l in meta.splitlines() if l.startswith(prefix)),
                  "",
              )

          declared = field("License-Expression") or field("License")
          if not declared or declared.upper() in {"TBD", "UNKNOWN", "NONE"}:
              sys.exit(
                  f"Licence is {declared!r}. Publishing code with no licence grant means\n"
                  "nobody may legally use it, which defeats the point of publishing.\n"
                  "Set it in agent-kit/pyproject.toml and add a LICENSE file first."
              )
          if not shipped:
              sys.exit(
                  f"Licence declared as {declared} but no licence text ships in the wheel.\n"
                  "A package nobody can read the terms of is one nobody can comply with.\n"
                  "Check `license-files` in agent-kit/pyproject.toml."
              )
          print(f"licence declared as {declared}, text shipped at {shipped[0]}")
          PY

      - name: Refuse to publish a version that does not match the tag
        if: github.event_name == 'release'
        run: |
          python - <<'PY'
          import glob, os, re, sys
          sdist = glob.glob("agent-kit/dist/*.tar.gz")[0]
          built = re.search(r"-(\d[^-]*)\.tar\.gz$", os.path.basename(sdist)).group(1)
          tag = os.environ["TAG"].lstrip("v")
          if built != tag:
              sys.exit(f"tag {tag!r} does not match the built version {built!r}")
          print(f"tag and version agree on {built}")
          PY
        env:
          TAG: ${{ github.event.release.tag_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: agent-kit/dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest

    # Bound to an environment, which is where the guard on this irreversible
    # step actually lives: `pypi` admits only `v*` tags, so nothing publishes
    # from a branch. A required reviewer would be better and needs a billing
    # plan this repository does not have; agent-kit/RELEASING.md records that.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
